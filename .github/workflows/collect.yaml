name: Auto Aggregator (Full Config)

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyyaml

      - name: Run collect (原始上传)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python subscribe/collect.py \
            -g ${{ secrets.GIST_USERNAME }}/${{ secrets.GIST_ID }} \
            -k ${{ secrets.GIST_TOKEN }} \
            -t clash

      - name: Patch Gist directly
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          cat > patch_gist.py << 'EOF'
          import requests, yaml, os, sys

          gist_id = os.environ['GIST_ID']
          token = os.environ['GIST_TOKEN']
          headers = {'Authorization': f'token {token}'}

          resp = requests.get(f'https://api.github.com/gists/{gist_id}', headers=headers)
          if resp.status_code != 200:
              print(f"ERROR: Cannot get gist {resp.status_code} {resp.text}")
              sys.exit(1)
          gist = resp.json()
          filename = list(gist['files'].keys())[0]
          content = gist['files'][filename]['content']
          print(f"Found file: {filename}")

          data = yaml.safe_load(content)
          proxy_names = [p['name'] for p in data['proxies']]
          data['proxy-groups'] = [
              {
                  'name': '🚀 手动选择',
                  'type': 'select',
                  'proxies': proxy_names + ['DIRECT']
              },
              {
                  'name': '⚡ 自动选择',
                  'type': 'url-test',
                  'proxies': proxy_names,
                  'url': 'http://www.gstatic.com/generate_204',
                  'interval': 300
              }
          ]
          data['rules'] = ['MATCH,🚀 手动选择']

          patched_yaml = yaml.dump(data, allow_unicode=True, default_flow_style=False, sort_keys=False)

          patch_resp = requests.patch(
              f'https://api.github.com/gists/{gist_id}',
              headers=headers,
              json={'files': {filename: {'content': patched_yaml}}}
          )
          if patch_resp.status_code == 200:
              print("✅ Patched config uploaded successfully!")
          else:
              print(f"❌ Upload failed: {patch_resp.status_code} {patch_resp.text}")
              sys.exit(1)
          EOF

          python patch_gist.py
