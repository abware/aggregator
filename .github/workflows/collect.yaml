name: Auto Aggregator

# 触发条件：每天 UTC 时间 0 点和 12 点自动运行，也支持手动触发
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collect script
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python subscribe/collect.py \
            -g ${{ secrets.GIST_USERNAME }}/${{ secrets.GIST_ID }} \
            -k ${{ secrets.GIST_TOKEN }} \
            -t clash v2ray singbox
