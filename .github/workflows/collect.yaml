name: Auto Aggregator with Full Config

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyyaml

      - name: Run collect
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python subscribe/collect.py \
            -g ${{ secrets.GIST_USERNAME }}/${{ secrets.GIST_ID }} \
            -k ${{ secrets.GIST_TOKEN }} \
            -t clash

      - name: Patch config
        run: |
          # 把补丁脚本写入文件，避免内嵌引号和缩进混乱
          cat > patch.py << 'EOF'
          import yaml

          with open('clash.yaml', 'r', encoding='utf-8') as f:
              data = yaml.safe_load(f)

          proxy_names = [p['name'] for p in data['proxies']]
          data['proxy-groups'] = [{
              'name': '🚀 手动选择',
              'type': 'select',
              'proxies': proxy_names + ['DIRECT']
          }]
          data['rules'] = ['MATCH,🚀 手动选择']

          with open('clash.yaml', 'w', encoding='utf-8') as f:
              yaml.dump(data, f, allow_unicode=True, default_flow_style=False, sort_keys=False)
          print('Patched successfully')
          EOF
          python patch.py

      - name: Upload patched config to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          # 用 GitHub CLI 更新 Gist，自动处理 JSON 转义
          echo "$GIST_TOKEN" | gh auth login --with-token
          gh gist edit "$GIST_ID" clash.yaml
